[project]
name = "research-council"
version = "1.0.0"
description = "Multi-agent research consensus council with persistence & REST API dashboard."
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.49",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
