name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff playwright
        pip install .
        playwright install chromium

    - name: Lint with ruff
      run: |
        ruff check council.py

    - name: Syntax compilation check
      run: |
        python -m py_compile council.py api.py

    - name: Run E2E and API tests
      env:
        # E2E spins the API on 8081 (see tests/test_e2e.py). Local UI docs use 8090; Docker uses 8080.
        OPENAI_API_KEY: dummy_openai_key
        WEBHOOK_URL: http://127.0.0.1:8081/dummy_webhook
        LLM_PROVIDER: stub
        FALLBACK_PROVIDER: stub
      run: |
        pip install pytest
        pytest tests/test_units.py tests/test_e2e.py

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install and run frontend unit tests
      run: |
        cd frontend
        npm install
        npm test
