name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff playwright
        pip install .
        playwright install chromium

    - name: Lint with ruff
      run: |
        ruff check council.py

    - name: Syntax compilation check
      run: |
        python -m py_compile council.py

    - name: Run E2E and API tests
      env:
        OPENAI_API_KEY: dummy_openai_key
        WEBHOOK_URL: http://localhost:8080/dummy_webhook
      run: |
        pip install pytest
        pytest tests/test_units.py tests/test_e2e.py
