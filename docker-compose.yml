version: '3.8'
# Container ports use 8080. Local Windows stub + Vite pairing prefers 8090 (SETUP.md).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=stub
      - FALLBACK_PROVIDER=stub
      - OPENAI_API_KEY=dummy-openai-api-key-value
      - WEBHOOK_URL=http://localhost:8080/dummy-webhook
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DB_PATH=/app/data/council.db
      - CHROMA_DB_PATH=/app/data/chroma_db
    volumes:
      - backend_data:/app/data
    networks:
      - rcc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      # Host browser reaches the published backend port
      - VITE_API_WSS_URL=ws://localhost:8080
      - VITE_API_REST_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - rcc_network

volumes:
  backend_data:

networks:
  rcc_network:
    driver: bridge
